<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ALIOS ONE — Cálculos de Engenharia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1e">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1e;--surface:#131a2e;--surface2:#1a2340;--accent:#1e8aff;--accent-dk:#1565c0;
  --ok:#10b981;--tx:#e4e8f1;--tx-dim:#6b7a99;--border:#1e2a45;
  --user-bub:#1c3a6e;--bot-bub:#1a2340;--danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ─── Splash ─── */
.splash{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;cursor:pointer;transition:opacity 0.5s}
.splash.hide{opacity:0;pointer-events:none}
.splash-logo{animation:fadeUp .8s ease}
.splash-logo img{max-width:420px;width:80vw;height:auto}
.splash-enter{margin-top:48px;font-size:13px;color:var(--tx-dim);animation:pulse 2s ease-in-out infinite;animation-delay:1s;opacity:0;animation-fill-mode:forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}

/* ─── Activation ─── */
.activation{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:250;gap:16px}
.activation.hide{display:none}
.act-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;max-width:400px;width:90%}
.act-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:24px;letter-spacing:3px;margin-bottom:4px}
.act-title span:first-child{color:#c8d6e8}.act-title span:last-child{color:var(--accent)}
.act-sub{font-size:13px;color:var(--tx-dim);margin-bottom:24px}
.act-field{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.act-field label{font-size:12px;color:var(--tx-dim)}
.act-field input{padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:14px;outline:none}
.act-field input:focus{border-color:var(--accent)}
.act-btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
.act-btn:hover{background:var(--accent-dk)}
.act-error{color:var(--danger);font-size:12px;margin-top:8px;display:none}
.act-contact{font-size:11px;color:var(--tx-dim);margin-top:16px;text-align:center}

/* ─── App ─── */
.app{display:none;flex-direction:column;height:100vh}
.app.visible{display:flex}

/* ─── Header ─── */
.header{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.header-logo svg{display:block}
.header-info{flex:1}
.header-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;letter-spacing:2px}
.header-title span:first-child{color:#c8d6e8}.header-title span:last-child{color:var(--accent)}
.header-sub{font-size:11px;color:var(--tx-dim);margin-top:1px}
.header-btns{display:flex;gap:6px}
.hdr-btn{padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--tx-dim);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer}
.hdr-btn:hover{background:var(--surface2);color:var(--tx)}
.hdr-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hdr-btn.primary:hover{background:var(--accent-dk)}

/* ─── Progress ─── */
.progress-track{height:3px;background:var(--border);flex-shrink:0}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .4s}

/* ─── Main content ─── */
.main{flex:1;overflow-y:auto;padding:0;display:flex;flex-direction:column}
.main::-webkit-scrollbar{width:5px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ─── Menu de áreas ─── */
.area-menu{padding:24px 16px;display:flex;flex-direction:column;gap:12px;max-width:700px;width:100%;margin:0 auto}
.area-menu-title{font-size:14px;color:var(--tx-dim);margin-bottom:4px}
.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.area-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:all .15s}
.area-card:hover{background:var(--surface2);border-color:var(--accent)}
.area-card.disabled{opacity:.4;cursor:default}
.area-card.disabled:hover{background:var(--surface);border-color:var(--border)}
.area-icon{font-size:24px;margin-bottom:8px}
.area-name{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:4px}
.area-desc{font-size:12px;color:var(--tx-dim);line-height:1.4}
.area-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;margin-top:8px;font-weight:500}
.badge-active{background:#14532d;color:#86efac}
.badge-soon{background:#451a03;color:#fcd34d}

/* ─── Menu de ferramentas ─── */
.tool-menu{padding:24px 16px;max-width:700px;width:100%;margin:0 auto}
.tool-grid{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tool-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s}
.tool-card:hover{background:var(--surface2);border-color:var(--accent)}
.tool-card.disabled{opacity:.4;cursor:default}
.tool-card.disabled:hover{background:var(--surface);border-color:var(--border)}
.tool-icon{font-size:22px;flex-shrink:0}
.tool-name{font-size:14px;font-weight:500;color:var(--tx)}
.tool-desc{font-size:12px;color:var(--tx-dim);margin-top:2px}

/* ─── Chat / Calculator ─── */
.chat-wrap{flex:1;display:flex;flex-direction:column}
.chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.chat-log::-webkit-scrollbar{width:4px}
.chat-log::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.bot-row{display:flex;align-items:flex-start;gap:10px}
.bot-av{width:28px;height:28px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center}
.bot-bubble{background:var(--bot-bub);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:14px;color:#d0d6e8;line-height:1.6;max-width:88%}
.user-bubble{background:var(--user-bub);border-radius:14px 4px 14px 14px;padding:10px 14px;font-size:14px;color:#c0c8dc;align-self:flex-end;max-width:75%}
.btns-row{display:flex;gap:8px;flex-wrap:wrap;padding-left:38px}
.pill-btn{padding:8px 16px;background:#1e3060;border:1px solid #2e4880;border-radius:999px;color:#7eb3f5;font-size:13px;cursor:pointer;transition:all .15s}
.pill-btn:hover{background:#263870;color:#a8ccff}
.pill-btn:disabled{opacity:.45;cursor:default}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-left:38px;max-width:95%}
.mode-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s}
.mode-card:hover{background:var(--surface2);border-color:var(--accent)}
.mode-card-icon{font-size:22px;margin-bottom:8px}
.mode-card-title{font-size:14px;font-weight:500;color:var(--tx);margin-bottom:4px}
.mode-card-desc{font-size:12px;color:var(--tx-dim);line-height:1.5}
.input-form{background:var(--bot-bub);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:14px 16px;max-width:96%}
.form-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-end;flex-wrap:wrap}
.form-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:70px}
.form-field label{font-size:11px;color:var(--tx-dim)}
.form-field input,.form-field select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:#151b2e;color:#d0d6e8;font-size:13px;outline:none;width:100%}
.form-field input:focus,.form-field select:focus{border-color:var(--accent)}
.add-btn{padding:7px 14px;background:#1e3060;border:1px solid #2e4880;border-radius:6px;color:#7eb3f5;font-size:13px;cursor:pointer;white-space:nowrap;align-self:flex-end}
.add-btn:hover{background:#263870}
.items-list{margin:6px 0;display:flex;flex-direction:column;gap:4px}
.item-tag{display:flex;align-items:center;justify-content:space-between;background:#151b2e;border-radius:6px;padding:6px 10px;font-size:12px;color:#a0aec0}
.item-tag span{color:#d0d6e8;font-weight:500}
.del-btn{background:none;border:none;color:#4a5568;cursor:pointer;font-size:13px;padding:0 4px}
.del-btn:hover{color:#fca5a5}
.form-actions{display:flex;gap:8px;margin-top:6px}
.continuar-btn{flex:1;padding:8px;background:var(--accent);border:none;border-radius:6px;color:#fff;font-size:13px;cursor:pointer}
.continuar-btn:hover{background:var(--accent-dk)}
.skip-btn{flex:1;padding:8px;background:#1e3060;border:1px solid #2e4880;border-radius:6px;color:#7eb3f5;font-size:13px;cursor:pointer}
.skip-btn:hover{background:#263870}
.tipo-toggle{display:flex;gap:6px;margin-bottom:8px}
.tipo-btn{padding:5px 12px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--tx-dim);font-size:12px;cursor:pointer;transition:all .15s}
.tipo-btn.active{background:#1e3060;border-color:#2e4880;color:#7eb3f5}
.result-bubble{background:var(--bot-bub);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:14px 16px;max-width:98%}
.rlabel{font-size:11px;color:var(--tx-dim);margin-bottom:8px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mc{background:#151b2e;border-radius:8px;padding:10px}
.ml{font-size:11px;color:var(--tx-dim);margin-bottom:3px}
.mv{font-size:17px;font-weight:500;color:var(--tx)}
.mu{font-size:11px;color:var(--tx-dim);margin-top:2px}
.rect-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.rdims{font-size:13px;font-weight:500;color:#d0d6e8;min-width:105px}
.rratio{font-size:12px;color:var(--tx-dim);flex:1}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500}
.bok{background:#14532d;color:#86efac}
.bwarn{background:#451a03;color:#fcd34d}
.bbad{background:#450a0a;color:#fca5a5}
.res-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}
.res-table th{color:var(--tx-dim);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--border)}
.res-table td{color:#d0d6e8;padding:5px 6px;border-bottom:1px solid var(--surface2)}
.res-table tr:last-child td{border-bottom:none}
.total-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.total-card{background:#151b2e;border-radius:8px;padding:12px}
.total-label{font-size:11px;color:var(--tx-dim);margin-bottom:4px}
.total-value{font-size:22px;font-weight:500;color:var(--ok)}
.total-unit{font-size:11px;color:var(--tx-dim);margin-top:2px}
.chat-input-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface)}
.chat-input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#151b2e;color:#d0d6e8;outline:none;font-family:'DM Sans',sans-serif}
.chat-input::placeholder{color:#4a5568}
.chat-input:focus{border-color:var(--accent)}
.chat-input:disabled{opacity:.35}
.chat-send{padding:9px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif}
.chat-send:hover{background:var(--accent-dk)}
.chat-send:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>

<!-- ═══ ACTIVATION ═══ -->
<div class="activation" id="activation">
  <div class="act-box">
    <div class="act-title"><span>ALIOS </span><span>ONE</span></div>
    <div class="act-sub">Introduza as credenciais de activação.</div>
    <div class="act-field">
      <label>Email</label>
      <input type="email" id="act-email" placeholder="nome@empresa.pt"/>
    </div>
    <div class="act-field">
      <label>Código de activação</label>
      <input type="text" id="act-code" placeholder="XXXX-XXXX-XXXX-XXXX" style="font-family:'JetBrains Mono',monospace;letter-spacing:2px"/>
    </div>
    <button class="act-btn" onclick="tryActivate()">Activar</button>
    <div class="act-error" id="act-error">Código inválido. Tente novamente.</div>
    <div class="act-contact">Contacte beatriz@aliosone.com para obter uma licença.</div>
  </div>
</div>

<!-- ═══ SPLASH ═══ -->
<div class="splash" id="splash" onclick="enterApp()" style="display:none">
  <div class="splash-logo"><img src="splash.png" alt="ALIOS ONE"></div>
  <div class="splash-enter">clica para avançar</div>
</div>

<!-- ═══ APP ═══ -->
<div class="app" id="app">
  <div class="header">
    <div class="header-logo">
      <svg width="28" height="42" viewBox="0 0 100 168" fill="none">
        <path d="M50 0 L-4 165 L30 165 L62 28 Z" fill="#1E8AFF"/>
        <path d="M50 0 L104 165 L70 165 L42 28 Z" fill="#D8E2F0"/>
        <path d="M30 130 C30 116, 70 116, 70 130 C70 148, 50 155, 50 155 C50 155, 30 148, 30 130 Z" fill="#0a0f1e"/>
        <circle cx="50" cy="138" r="18" fill="#10b981"/>
      </svg>
    </div>
    <div class="header-info">
      <div class="header-title"><span>ALIOS </span><span>ONE</span></div>
      <div class="header-sub" id="header-sub">Cálculos de Engenharia</div>
    </div>
    <div class="header-btns" id="header-btns"></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
  <div class="main" id="main"></div>
</div>

<script>
// ═══════════════════════════════════════════════════
// ALIOS ONE — Cálculos de Engenharia
// ═══════════════════════════════════════════════════

const CHAVE_MESTRA = "ALIOS-ONE-2026-BB-CALCULOS";
const LICENSE_KEY = "alios_calculos_license";

// ─── Activation ───
async function sha256(msg){const enc=new TextEncoder().encode(msg);const hash=await crypto.subtle.digest('SHA-256',enc);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();}

async function gerarCodigo(email){
  email=email.trim().toLowerCase();
  const h=await sha256(CHAVE_MESTRA+":"+email);
  return h.substr(0,4)+"-"+h.substr(4,4)+"-"+h.substr(8,4)+"-"+h.substr(12,4);
}

async function tryActivate(){
  const email=document.getElementById('act-email').value.trim();
  const code=document.getElementById('act-code').value.trim().toUpperCase();
  const err=document.getElementById('act-error');
  if(!email||!email.includes('@')){err.textContent='Email inválido.';err.style.display='block';return;}
  const expected=await gerarCodigo(email);
  if(code===expected){
    localStorage.setItem(LICENSE_KEY,JSON.stringify({email,code}));
    document.getElementById('activation').classList.add('hide');
    document.getElementById('splash').style.display='flex';
    err.style.display='none';
  } else {
    err.textContent='Código inválido. Tente novamente.';err.style.display='block';
  }
}

async function checkLicense(){
  try{
    const data=JSON.parse(localStorage.getItem(LICENSE_KEY));
    if(!data)return false;
    const expected=await gerarCodigo(data.email);
    return data.code===expected;
  }catch(e){return false;}
}

async function initApp(){
  const valid=await checkLicense();
  if(valid){
    document.getElementById('activation').classList.add('hide');
    document.getElementById('splash').style.display='flex';
  }
}

function enterApp(){
  const s=document.getElementById('splash');
  s.classList.add('hide');
  document.getElementById('app').classList.add('visible');
  setTimeout(()=>{s.style.display='none';showAreaMenu();},500);
}

// ─── Constants ───
const DN=[80,100,125,150,160,180,200,224,250,280,300,350,400,450,500,550,600];
const RECT_DIMS=[];for(let v=100;v<=1200;v+=50)RECT_DIMS.push(v);
const RHO=1.2;

const AVATAR_SVG='<svg width="26" height="26" viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="28" fill="#0a0f1e"/><g transform="translate(25,8)"><path d="M25 0 L-2 82 L15 82 L31 14 Z" fill="#1E8AFF"/><path d="M25 0 L52 82 L35 82 L21 14 Z" fill="#D8E2F0"/><circle cx="25" cy="68" r="9" fill="#10b981"/></g></svg>';

// ─── Areas config ───
const AREAS=[
  {id:'avac',icon:'🌀',name:'AVAC',desc:'Condutas, ventilação, climatização',active:true,
   tools:[
     {id:'dim_condutas',icon:'📐',name:'Dimensionamento de condutas',desc:'Diâmetro, velocidade e equivalentes rectangulares'},
     {id:'ped_instalacao',icon:'🔧',name:'PED da instalação',desc:'Perda de carga total do circuito mais desfavorável'},
   ]},
  {id:'aguas',icon:'💧',name:'Águas e Esgotos',desc:'Tubagens, bombas, depósitos',active:false,tools:[]},
  {id:'electricidade',icon:'⚡',name:'Electricidade',desc:'Circuitos, protecções, quadros',active:false,tools:[]},
  {id:'termica',icon:'🌡️',name:'Comportamento Térmico',desc:'Envolventes, pontes térmicas, condensações',active:false,tools:[]},
  {id:'desenfumagem',icon:'🔥',name:'Desenfumagem',desc:'Caudais, pressurização, condutas de desenfumagem',active:false,tools:[]},
  {id:'incendio',icon:'🧯',name:'Segurança contra Incêndio',desc:'Cargas de incêndio, meios de extinção',active:false,tools:[]},
];

// ─── State ───
let currentArea=null;
let modo=null;
let estadoA={fase:0,modoCalc:null,caudal:null};
let dadosB={trocos:[],sing90:[],sing45:[],singT:[],fixas:[]};
let projectLog=[];  // futuro: registo de cálculos

// ─── DOM helpers ───
const mainEl=()=>document.getElementById('main');
const setSub=t=>document.getElementById('header-sub').textContent=t;
const setProgress=p=>document.getElementById('progress').style.width=p+'%';

function setHeaderBtns(btns){
  const wrap=document.getElementById('header-btns');wrap.innerHTML='';
  btns.forEach(b=>{const el=document.createElement('button');el.className='hdr-btn'+(b.primary?' primary':'');el.textContent=b.label;el.onclick=b.action;wrap.appendChild(el);});
}

function scroll(){const m=mainEl();m.scrollTop=m.scrollHeight;}

// ─── Area Menu ───
function showAreaMenu(){
  currentArea=null;modo=null;setProgress(0);setSub('Cálculos de Engenharia');setHeaderBtns([]);
  const m=mainEl();m.innerHTML='';
  const wrap=document.createElement('div');wrap.className='area-menu';
  wrap.innerHTML='<div class="area-menu-title">Seleccione a área de engenharia</div>';
  const grid=document.createElement('div');grid.className='area-grid';
  AREAS.forEach(a=>{
    const card=document.createElement('div');
    card.className='area-card'+(a.active?'':' disabled');
    card.innerHTML=`<div class="area-icon">${a.icon}</div><div class="area-name">${a.name}</div><div class="area-desc">${a.desc}</div><div class="area-badge ${a.active?'badge-active':'badge-soon'}">${a.active?a.tools.length+' ferramenta'+(a.tools.length!==1?'s':''):'Em breve'}</div>`;
    if(a.active)card.onclick=()=>showToolMenu(a);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);m.appendChild(wrap);
}

// ─── Tool Menu ───
function showToolMenu(area){
  currentArea=area;setProgress(0);setSub(area.name);
  setHeaderBtns([{label:'← Áreas',action:showAreaMenu}]);
  const m=mainEl();m.innerHTML='';
  const wrap=document.createElement('div');wrap.className='tool-menu';
  wrap.innerHTML=`<div class="area-menu-title">${area.icon} ${area.name} — Ferramentas</div>`;
  const grid=document.createElement('div');grid.className='tool-grid';
  area.tools.forEach(t=>{
    const card=document.createElement('div');card.className='tool-card';
    card.innerHTML=`<div class="tool-icon">${t.icon}</div><div><div class="tool-name">${t.name}</div><div class="tool-desc">${t.desc}</div></div>`;
    card.onclick=()=>launchTool(t.id);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);m.appendChild(wrap);
}

// ─── Tool launcher ───
function launchTool(id){
  if(id==='dim_condutas'){modo='a';iniciarModoA();}
  else if(id==='ped_instalacao'){modo='b';iniciarModoB();}
}

// ─── Chat helpers ───
function setupChat(){
  const m=mainEl();m.innerHTML='';
  const chatWrap=document.createElement('div');chatWrap.className='chat-wrap';
  chatWrap.innerHTML=`<div class="chat-log" id="log"></div><div class="chat-input-row"><input class="chat-input" id="inp" placeholder="Escreva aqui..." disabled onkeydown="if(event.key==='Enter')enviar()"/><button class="chat-send" id="sendbtn" onclick="enviar()" disabled>Enviar</button></div>`;
  m.appendChild(chatWrap);
}

function logEl(){return document.getElementById('log');}
function addBot(html){const row=document.createElement('div');row.className='bot-row';row.innerHTML=`<div class="bot-av">${AVATAR_SVG}</div><div class="bot-bubble">${html}</div>`;logEl().appendChild(row);scroll();}
function addUser(txt){const d=document.createElement('div');d.className='user-bubble';d.textContent=txt;logEl().appendChild(d);scroll();}
function enableInput(ph){const i=document.getElementById('inp');i.disabled=false;i.placeholder=ph||'Escreva aqui...';i.focus();document.getElementById('sendbtn').disabled=false;}
function disableInput(){const i=document.getElementById('inp');i.disabled=true;document.getElementById('sendbtn').disabled=true;i.value='';}

function addPills(pills){
  const wrap=document.createElement('div');wrap.className='btns-row';
  pills.forEach(p=>{const btn=document.createElement('button');btn.className='pill-btn';btn.textContent=p.label;btn.onclick=()=>{wrap.querySelectorAll('.pill-btn').forEach(x=>x.disabled=true);addUser(p.label);p.action();};wrap.appendChild(btn);});
  logEl().appendChild(wrap);scroll();
}

// ─── Math helpers ───
function areaCirc(dn){const r=dn/2000;return Math.PI*r*r;}
function areaRect(a,b){return(a/1000)*(b/1000);}
function deqHuebscher(a,b){return 1.265*Math.pow(a*b,0.6)/Math.pow(a+b,0.2);}
function velocidade(Q_h,area){return(Q_h/3600)/area;}
function labelSecao(item){return item.tipo==='circ'?`Ø${item.dn}`:`${item.a}×${item.b}`;}

// ─── Modo A — Dimensionamento ───
function iniciarModoA(){
  setupChat();setProgress(10);setSub('AVAC — Dimensionamento de condutas');
  setHeaderBtns([{label:'← Ferramentas',action:()=>showToolMenu(currentArea)},{label:'Novo',primary:true,action:iniciarModoA}]);
  estadoA={fase:0,modoCalc:null,caudal:null};
  addBot('Seleccione o método de dimensionamento.');
  addPills([{label:'Por perda de carga (mmca/m)',action:()=>escolherModoA('ped')},{label:'Por velocidade (m/s)',action:()=>escolherModoA('vel')}]);
}

function escolherModoA(m){estadoA.modoCalc=m;estadoA.fase=1;setProgress(35);addBot('Qual o <strong>caudal</strong> em m³/h?');enableInput('Caudal em m³/h...');}

function enviar(){const val=document.getElementById('inp').value.trim();if(!val)return;if(modo==='a')enviarA(val);}

function enviarA(val){
  const num=parseFloat(val.replace(',','.'));disableInput();
  if(isNaN(num)||num<=0){addUser(val);addBot('Valor inválido. Indique um número positivo.');enableInput();return;}
  addUser(val);
  if(estadoA.fase===1){
    estadoA.caudal=num;estadoA.fase=2;setProgress(65);
    if(estadoA.modoCalc==='ped'){addBot('Qual a <strong>perda de carga</strong> em mmca/m?');enableInput('PED em mmca/m...');}
    else{addBot('Qual a <strong>velocidade</strong> em m/s?');enableInput('Velocidade em m/s...');}
  }else if(estadoA.fase===2){
    setProgress(100);const res=calcularA(estadoA.caudal,num,estadoA.modoCalc);
    projectLog.push({tool:'dim_condutas',input:{caudal:estadoA.caudal,param:num,modo:estadoA.modoCalc},result:res,ts:new Date().toISOString()});
    addResultA(res);
    estadoA.fase=1;estadoA.caudal=null;
    setTimeout(()=>{setProgress(20);addBot('Novo cálculo?');
      addPills([{label:'Sim, mesmo método',action:()=>{estadoA.fase=1;setProgress(35);addBot('Qual o <strong>caudal</strong> em m³/h?');enableInput('Caudal em m³/h...');}},
        {label:'Mudar método',action:iniciarModoA},{label:'← Ferramentas',action:()=>showToolMenu(currentArea)}]);},400);
  }
}

function calcularA(Q_h,param,mc){
  const Q=Q_h/3600,lambda=0.02;let D_calc_m;
  if(mc==='ped'){const dPm_Pa=param*9.81;D_calc_m=Math.pow((lambda*RHO*Q*Q*8)/(Math.PI*Math.PI*dPm_Pa),1/5);}
  else D_calc_m=Math.sqrt(4*Q/(Math.PI*param));
  const D_calc_mm=D_calc_m*1000;
  const D_norm=DN.reduce((p,c)=>Math.abs(c-D_calc_mm)<Math.abs(p-D_calc_mm)?c:p);
  const D_norm_m=D_norm/1000,A=Math.PI*D_norm_m*D_norm_m/4,v_real=Q/A;
  const dPm_Pa=lambda*RHO*v_real*v_real/(2*D_norm_m),dPm_mmca=dPm_Pa/9.81;
  return{D_norm,D_calc_mm,v_real,dPm_Pa,dPm_mmca,rects:calcRects(D_norm)};
}

function calcRects(D_norm){
  const dims=[];
  for(let a=100;a<=1200;a+=50)for(let b=100;b<=a;b+=50){const deq=deqHuebscher(a,b);dims.push({a,b,deq,diff:Math.abs(deq-D_norm),ratio:a/b});}
  dims.sort((x,y)=>x.diff-y.diff);const out=[],seen=new Set();
  for(const d of dims){const k=`${d.a}x${d.b}`;if(!seen.has(k)&&out.length<3){seen.add(k);out.push(d);}if(out.length>=3)break;}
  return out;
}

function addResultA(r){
  const row=document.createElement('div');row.className='bot-row';
  const av=document.createElement('div');av.className='bot-av';av.innerHTML=AVATAR_SVG;
  const bubble=document.createElement('div');bubble.className='result-bubble';
  bubble.innerHTML=`
    <div class="rlabel">Conduta circular</div>
    <div class="metrics">
      <div class="mc"><div class="ml">Diâmetro norm.</div><div class="mv">Ø ${r.D_norm}</div><div class="mu">mm (calc: ${Math.round(r.D_calc_mm)} mm)</div></div>
      <div class="mc"><div class="ml">Velocidade real</div><div class="mv">${r.v_real.toFixed(2)}</div><div class="mu">m/s</div></div>
      <div class="mc"><div class="ml">Perda linear</div><div class="mv">${r.dPm_Pa.toFixed(2)}</div><div class="mu">Pa/m · ${r.dPm_mmca.toFixed(3)} mmca/m</div></div>
    </div>
    <div class="rlabel">Equivalentes rectangulares</div>
    ${r.rects.map(rc=>`<div class="rect-row"><div class="rdims">${rc.a} × ${rc.b} mm</div><div class="rratio">rácio ${rc.ratio.toFixed(1)}:1 · Deq ${Math.round(rc.deq)} mm</div><span class="badge ${rc.ratio<=4?'bok':rc.ratio<=8?'bwarn':'bbad'}">${rc.ratio<=4?'recomendado':rc.ratio<=8?'aceitável':'evitar'}</span></div>`).join('')}
  `;
  row.appendChild(av);row.appendChild(bubble);logEl().appendChild(row);scroll();
}

// ─── Modo B — PED Instalação ───
function iniciarModoB(){
  setupChat();setProgress(5);setSub('AVAC — PED da instalação');
  setHeaderBtns([{label:'← Ferramentas',action:()=>showToolMenu(currentArea)},{label:'Novo',primary:true,action:iniciarModoB}]);
  dadosB={trocos:[],sing90:[],sing45:[],singT:[],fixas:[]};
  addBot('Cálculo da <strong>PED total da instalação</strong>.<br>Condutas circulares e rectangulares.');
  setTimeout(()=>passoTrocos(),400);
}

function buildSecaoFields(prefix){
  return `
    <div class="tipo-toggle">
      <button class="tipo-btn active" id="${prefix}-btn-circ" onclick="setTipo('${prefix}','circ')">Circular</button>
      <button class="tipo-btn" id="${prefix}-btn-rect" onclick="setTipo('${prefix}','rect')">Rectangular</button>
    </div>
    <div id="${prefix}-circ" style="display:flex;gap:8px;flex-wrap:wrap">
      <div class="form-field" style="min-width:100px"><label>Diâmetro</label><select id="${prefix}-dn">${DN.map(d=>`<option value="${d}">Ø ${d}</option>`).join('')}</select></div>
    </div>
    <div id="${prefix}-rect" style="display:none;gap:8px;flex-wrap:wrap">
      <div class="form-field" style="min-width:80px"><label>Largura a (mm)</label><select id="${prefix}-a">${RECT_DIMS.map(d=>`<option value="${d}">${d}</option>`).join('')}</select></div>
      <div class="form-field" style="min-width:80px"><label>Altura b (mm)</label><select id="${prefix}-b">${RECT_DIMS.map(d=>`<option value="${d}">${d}</option>`).join('')}</select></div>
    </div>`;
}

function setTipo(prefix,tipo){
  document.getElementById(`${prefix}-btn-circ`).className='tipo-btn'+(tipo==='circ'?' active':'');
  document.getElementById(`${prefix}-btn-rect`).className='tipo-btn'+(tipo==='rect'?' active':'');
  document.getElementById(`${prefix}-circ`).style.display=tipo==='circ'?'flex':'none';
  document.getElementById(`${prefix}-rect`).style.display=tipo==='rect'?'flex':'none';
}
function getTipo(prefix){return document.getElementById(`${prefix}-btn-circ`).classList.contains('active')?'circ':'rect';}
function getSecao(prefix){
  const tipo=getTipo(prefix);
  if(tipo==='circ')return{tipo,dn:parseInt(document.getElementById(`${prefix}-dn`).value)};
  return{tipo,a:parseInt(document.getElementById(`${prefix}-a`).value),b:parseInt(document.getElementById(`${prefix}-b`).value)};
}

function passoTrocos(){
  setProgress(15);addBot('Passo 1 de 5 — <strong>Troços de conduta recta</strong>');
  const row=document.createElement('div');row.className='bot-row';
  const av=document.createElement('div');av.className='bot-av';av.innerHTML=AVATAR_SVG;
  const form=document.createElement('div');form.className='input-form';
  form.innerHTML=`${buildSecaoFields('t')}
    <div class="form-row" style="margin-top:8px">
      <div class="form-field"><label>Comprimento (m)</label><input type="number" id="t-comp" placeholder="ex: 10" min="0.1" step="0.1"/></div>
      <div class="form-field"><label>PED (mmca/m)</label><input type="number" id="t-ped" placeholder="ex: 0.10" step="0.01"/></div>
      <button class="add-btn" onclick="addTroco()">+ Adicionar</button>
    </div>
    <div class="items-list" id="t-list"></div>
    <div class="form-actions"><button class="continuar-btn" onclick="passoCurvas90()">Continuar →</button></div>`;
  row.appendChild(av);row.appendChild(form);logEl().appendChild(row);scroll();
}

function addTroco(){
  const secao=getSecao('t');
  const comp=parseFloat(document.getElementById('t-comp').value);
  const ped=parseFloat(document.getElementById('t-ped').value);
  if(!comp||!ped||comp<=0||ped<=0){alert('Preencha comprimento e PED.');return;}
  dadosB.trocos.push({...secao,comp,ped});
  renderListB('t-list',dadosB.trocos,i=>{const t=dadosB.trocos[i];return`${labelSecao(t)} — ${t.comp}m — ${t.ped} mmca/m`;});
  document.getElementById('t-comp').value='';document.getElementById('t-ped').value='';
}

function buildSingForm(prefix,addFn,skipFn,nextFn){
  const row=document.createElement('div');row.className='bot-row';
  const av=document.createElement('div');av.className='bot-av';av.innerHTML=AVATAR_SVG;
  const form=document.createElement('div');form.className='input-form';
  form.innerHTML=`${buildSecaoFields(prefix)}
    <div class="form-row" style="margin-top:8px">
      <div class="form-field"><label>Caudal (m³/h)</label><input type="number" id="${prefix}-q" placeholder="ex: 500"/></div>
      <div class="form-field" style="max-width:70px"><label>Qtd.</label><input type="number" id="${prefix}-qty" value="1" min="1"/></div>
      <button class="add-btn" onclick="${addFn}()">+ Adicionar</button>
    </div>
    <div class="items-list" id="${prefix}-list"></div>
    <div class="form-actions">
      <button class="skip-btn" onclick="addUser('Nenhuma');${skipFn}()">Nenhuma</button>
      <button class="continuar-btn" onclick="${nextFn}()">Continuar →</button>
    </div>`;
  row.appendChild(av);row.appendChild(form);logEl().appendChild(row);scroll();
}

function addSing(arr,prefix,label){
  const secao=getSecao(prefix);
  const q=parseFloat(document.getElementById(`${prefix}-q`).value);
  const qty=parseInt(document.getElementById(`${prefix}-qty`).value)||1;
  if(!q||q<=0){alert('Preencha o caudal.');return;}
  arr.push({...secao,caudal:q,qty});
  renderListB(`${prefix}-list`,arr,i=>`${labelSecao(arr[i])} — ${arr[i].caudal} m³/h — ${arr[i].qty}× ${label}`);
  document.getElementById(`${prefix}-q`).value='';document.getElementById(`${prefix}-qty`).value='1';
}

function passoCurvas90(){
  if(dadosB.trocos.length===0){alert('Adicione pelo menos um troço.');return;}
  addUser('Continuar →');setProgress(30);
  addBot('Passo 2 de 5 — <strong>Curvas de 90°</strong>');
  buildSingForm('c90','addC90','skipC90','passoCurvas45');
}
function addC90(){addSing(dadosB.sing90,'c90','Curva 90°');}
function skipC90(){passoCurvas45();}

function passoCurvas45(){
  addUser('Continuar →');setProgress(45);
  addBot('Passo 3 de 5 — <strong>Curvas de 45°</strong>');
  buildSingForm('c45','addC45','skipC45','passoDerivacoes');
}
function addC45(){addSing(dadosB.sing45,'c45','Curva 45°');}
function skipC45(){passoDerivacoes();}

function passoDerivacoes(){
  addUser('Continuar →');setProgress(60);
  addBot('Passo 4 de 5 — <strong>Derivações em T</strong>');
  buildSingForm('dt','addDT','skipDT','passoFixas');
}
function addDT(){addSing(dadosB.singT,'dt','Derivação T');}
function skipDT(){passoFixas();}

function passoFixas(){
  addUser('Continuar →');setProgress(75);
  addBot('Passo 5 de 5 — <strong>Perdas fixas</strong><br>Grelhas, registos, filtros.');
  const row=document.createElement('div');row.className='bot-row';
  const av=document.createElement('div');av.className='bot-av';av.innerHTML=AVATAR_SVG;
  const form=document.createElement('div');form.className='input-form';
  form.innerHTML=`
    <div class="form-row">
      <div class="form-field" style="flex:2"><label>Descrição</label><input type="text" id="fx-desc" placeholder="ex: Grelha de insuflação"/></div>
      <div class="form-field"><label>Perda (Pa)</label><input type="number" id="fx-pa" placeholder="ex: 20"/></div>
      <button class="add-btn" onclick="addFixa()">+ Adicionar</button>
    </div>
    <div class="items-list" id="fx-list"></div>
    <div class="form-actions">
      <button class="skip-btn" onclick="addUser('Nenhuma');calcularTotal()">Nenhuma</button>
      <button class="continuar-btn" onclick="calcularTotal()">Calcular PED total →</button>
    </div>`;
  row.appendChild(av);row.appendChild(form);logEl().appendChild(row);scroll();
}

function addFixa(){
  const desc=document.getElementById('fx-desc').value.trim();
  const pa=parseFloat(document.getElementById('fx-pa').value);
  if(!desc||isNaN(pa)||pa<0){alert('Preencha descrição e Pa.');return;}
  dadosB.fixas.push({desc,pa});
  renderListB('fx-list',dadosB.fixas,i=>`${dadosB.fixas[i].desc} — ${dadosB.fixas[i].pa} Pa`);
  document.getElementById('fx-desc').value='';document.getElementById('fx-pa').value='';
}

function renderListB(id,arr,labelFn){
  const list=document.getElementById(id);if(!list)return;list.innerHTML='';
  arr.forEach((_,i)=>{const d=document.createElement('div');d.className='item-tag';d.innerHTML=`<span>${labelFn(i)}</span><button class="del-btn" onclick="delItemB('${id}',${i})">✕</button>`;list.appendChild(d);});scroll();
}

function delItemB(lid,idx){
  if(lid==='t-list'){dadosB.trocos.splice(idx,1);renderListB('t-list',dadosB.trocos,i=>{const t=dadosB.trocos[i];return`${labelSecao(t)} — ${t.comp}m — ${t.ped} mmca/m`;});}
  else if(lid==='c90-list'){dadosB.sing90.splice(idx,1);renderListB('c90-list',dadosB.sing90,i=>`${labelSecao(dadosB.sing90[i])} — ${dadosB.sing90[i].caudal} m³/h — ${dadosB.sing90[i].qty}× Curva 90°`);}
  else if(lid==='c45-list'){dadosB.sing45.splice(idx,1);renderListB('c45-list',dadosB.sing45,i=>`${labelSecao(dadosB.sing45[i])} — ${dadosB.sing45[i].caudal} m³/h — ${dadosB.sing45[i].qty}× Curva 45°`);}
  else if(lid==='dt-list'){dadosB.singT.splice(idx,1);renderListB('dt-list',dadosB.singT,i=>`${labelSecao(dadosB.singT[i])} — ${dadosB.singT[i].caudal} m³/h — ${dadosB.singT[i].qty}× Derivação T`);}
  else if(lid==='fx-list'){dadosB.fixas.splice(idx,1);renderListB('fx-list',dadosB.fixas,i=>`${dadosB.fixas[i].desc} — ${dadosB.fixas[i].pa} Pa`);}
}

function calcSingPerda(item,zeta){
  const area=item.tipo==='circ'?areaCirc(item.dn):areaRect(item.a,item.b);
  const v=velocidade(item.caudal,area);
  return{pa:zeta*0.5*RHO*v*v*item.qty,v};
}

function calcularTotal(){
  addUser('Calcular PED total →');setProgress(100);
  const linhas=[];let totalPa=0;
  dadosB.trocos.forEach(t=>{const pa=t.ped*9.81*t.comp;linhas.push({desc:`${labelSecao(t)} — ${t.comp}m @ ${t.ped} mmca/m`,pa});totalPa+=pa;});
  const addSingLinhas=(arr,zeta,label)=>arr.forEach(c=>{
    const{pa,v}=calcSingPerda(c,zeta);
    linhas.push({desc:`${c.qty}× ${label} ${labelSecao(c)} (v=${v.toFixed(2)} m/s)`,pa});totalPa+=pa;
  });
  addSingLinhas(dadosB.sing90,0.4,'Curva 90°');
  addSingLinhas(dadosB.sing45,0.17,'Curva 45°');
  addSingLinhas(dadosB.singT,0.9,'Derivação T');
  dadosB.fixas.forEach(f=>{linhas.push({desc:f.desc,pa:f.pa});totalPa+=f.pa;});
  const totalMmca=totalPa/9.81;

  projectLog.push({tool:'ped_instalacao',input:JSON.parse(JSON.stringify(dadosB)),result:{linhas,totalPa,totalMmca},ts:new Date().toISOString()});

  const row=document.createElement('div');row.className='bot-row';
  const av=document.createElement('div');av.className='bot-av';av.innerHTML=AVATAR_SVG;
  const bubble=document.createElement('div');bubble.className='result-bubble';
  bubble.innerHTML=`
    <div class="rlabel">Discriminação de perdas</div>
    <table class="res-table">
      <thead><tr><th>Elemento</th><th style="text-align:right">Pa</th><th style="text-align:right">mmca</th></tr></thead>
      <tbody>${linhas.map(l=>`<tr><td>${l.desc}</td><td style="text-align:right">${l.pa.toFixed(1)}</td><td style="text-align:right">${(l.pa/9.81).toFixed(2)}</td></tr>`).join('')}</tbody>
    </table>
    <div class="rlabel" style="margin-top:12px">PED total da instalação</div>
    <div class="total-row">
      <div class="total-card"><div class="total-label">Pascal</div><div class="total-value">${totalPa.toFixed(1)}</div><div class="total-unit">Pa</div></div>
      <div class="total-card"><div class="total-label">Milímetros de coluna de água</div><div class="total-value">${totalMmca.toFixed(2)}</div><div class="total-unit">mmca</div></div>
    </div>`;
  row.appendChild(av);row.appendChild(bubble);logEl().appendChild(row);scroll();
  setTimeout(()=>{setProgress(10);addBot('Novo cálculo?');
    addPills([{label:'Novo cálculo PED',action:iniciarModoB},{label:'← Ferramentas',action:()=>showToolMenu(currentArea)},{label:'← Áreas',action:showAreaMenu}]);},500);
}

// ─── Init ───
// ─── Service Worker ───
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}

initApp();
</script>
