<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ALIOS ONE — Cálculos de Engenharia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1e">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ═══ ACTIVATION ═══ -->
<div class="activation" id="activation">
  <div class="act-box">
    <div class="act-title"><span>ALIOS </span><span>ONE</span></div>
    <div class="act-sub">Introduza as credenciais de activação.</div>
    <div class="act-field">
      <label>Email</label>
      <input type="email" id="act-email" placeholder="nome@empresa.pt"/>
    </div>
    <div class="act-field">
      <label>Código de activação</label>
      <input type="text" id="act-code" placeholder="XXXX-XXXX-XXXX-XXXX" style="font-family:'JetBrains Mono',monospace;letter-spacing:2px"/>
    </div>
    <button class="act-btn" onclick="tryActivate()">Activar</button>
    <div class="act-error" id="act-error">Código inválido. Tente novamente.</div>
    <div class="act-contact">Contacte beatriz@aliosone.com para obter uma licença.</div>
  </div>
</div>

<!-- ═══ SPLASH ═══ -->
<div class="splash" id="splash" onclick="enterApp()" style="display:none">
  <div class="splash-logo"><img src="splash.png" alt="ALIOS ONE"></div>
  <div class="splash-enter">clica para avançar</div>
</div>

<!-- ═══ APP ═══ -->
<div class="app" id="app">
  <div class="header">
    <div class="header-logo">
      <svg width="28" height="42" viewBox="0 0 100 168" fill="none">
        <path d="M50 0 L-4 165 L30 165 L62 28 Z" fill="#1E8AFF"/>
        <path d="M50 0 L104 165 L70 165 L42 28 Z" fill="#D8E2F0"/>
        <path d="M30 130 C30 116, 70 116, 70 130 C70 148, 50 155, 50 155 C50 155, 30 148, 30 130 Z" fill="#0a0f1e"/>
        <circle cx="50" cy="138" r="18" fill="#10b981"/>
      </svg>
    </div>
    <div class="header-info">
      <div class="header-title"><span>ALIOS </span><span>ONE</span></div>
      <div class="header-sub" id="header-sub">Cálculos de Engenharia</div>
    </div>
    <div class="header-btns" id="header-btns"></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
  <div class="main" id="main"></div>
</div>

<!-- ═══ SCRIPTS ═══ -->
<!-- Biblioteca docx (geração de Word no browser) -->
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<!-- Biblioteca SheetJS (geração de Excel no browser) -->
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Core: activação, menus, helpers -->
<script src="js/app.js"></script>
<!-- Módulos de ferramentas (adicionar novos aqui) -->
<script src="js/avac.js"></script>
<script src="js/tubagens.js"></script>
<script src="js/vasos.js"></script>
<script src="js/aquecimento.js"></script>
<script src="js/hottes.js"></script>
<script src="js/rph_dados.js"></script>
<script src="js/rph_vent.js"></script>
<script src="js/rph_ui.js"></script>
<script src="js/ar_novo.js"></script>
<script src="js/clinicas.js"></script>
<script src="js/incendio.js"></script>
<script src="js/relatorio.js"></script>
<script src="js/termica.js"></script>
<script src="js/gtc_regras.js"></script>
<script src="js/gtc.js"></script>
<script src="js/parque_blocos.js"></script>
<script src="js/qe_simbolos.js"></script>
<script src="js/qe.js"></script>
<!-- <script src="js/aguas.js"></script> -->
<!-- <script src="js/desenfumagem.js"></script> -->

</body>
</html>
